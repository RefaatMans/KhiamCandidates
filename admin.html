<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Khaim Jobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <span class="brand-name">Home</span>
      </a>
      <nav>
        <span id="adminEmail" class="admin-email"></span>
        <button id="logoutBtn" class="nav-link" hidden>Log out</button>
      </nav>
    </div>
  </header>

  <main class="container main-content">

    <!-- Login view -->
    <section class="auth-card" id="loginSection">
      <h1>Admin Login</h1>
      <p class="subtitle">Sign in to upload candidate CVs.</p>
      <form id="loginForm" class="form">
        <label class="field">
          <span>Email</span>
          <input type="email" id="loginEmail" required autocomplete="email" />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="loginPassword" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn-primary">Sign in</button>
        <p id="loginError" class="error-msg" hidden></p>
      </form>
    </section>

    <!-- Admin panel -->
    <section id="adminPanel" hidden>
      <h1>Admin Panel</h1>
      <p class="subtitle">Upload new candidate CVs or manage existing ones.</p>

      <div class="admin-grid">
        <!-- Upload form -->
        <div class="card">
          <h2>Upload New CV</h2>
          <form id="uploadForm" class="form">
            <label class="field">
              <span>Candidate Name</span>
              <input type="text" id="candidateName" required placeholder="e.g. John Doe" />
            </label>

            <label class="field">
              <span>Phone Number</span>
              <input type="tel" id="candidatePhone" required placeholder="e.g. +1 555 123 4567" />
            </label>

            <label class="field">
              <span>Category</span>
              <select id="candidateCategory" required>
                <option value="">Select a category…</option>
              </select>
            </label>

            <label class="field" id="subcategoryField" hidden>
              <span>Subcategory <span class="field-optional">(optional)</span></span>
              <select id="candidateSubcategory">
                <option value="">— None —</option>
              </select>
            </label>

            <label class="field">
              <span>CV (PDF only, max 10MB)</span>
              <input type="file" id="candidateFile" accept="application/pdf" required />
            </label>

            <div class="progress-wrap" id="progressWrap" hidden>
              <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
              <span id="progressText">0%</span>
            </div>

            <button type="submit" class="btn btn-primary" id="uploadBtn">Upload CV</button>
            <p id="uploadStatus" class="status-msg" hidden></p>
          </form>
        </div>

        <!-- Existing CVs -->
        <div class="card">
          <div class="card-header">
            <h2>Existing CVs</h2>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
              <select id="filterCategory" class="filter-select">
                <option value="">All categories</option>
              </select>
              <select id="filterSubcategory" class="filter-select" hidden>
                <option value="">All subcategories</option>
              </select>
            </div>
          </div>
          <div id="adminCandidatesList" class="admin-candidates-list">
            <div class="loading">Loading…</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Edit Candidate Modal -->
  <div class="modal" id="editModal" hidden>
    <div class="modal-backdrop" data-close-edit></div>
    <div class="modal-content edit-modal-content">
      <div class="modal-header">
        <h2>Edit Candidate</h2>
        <button class="btn-icon" data-close-edit aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="editForm" class="form">
          <label class="field">
            <span>Candidate Name</span>
            <input type="text" id="editName" required />
          </label>

          <label class="field">
            <span>Phone Number</span>
            <input type="tel" id="editPhone" required placeholder="e.g. +1 555 123 4567" />
          </label>

          <label class="field">
            <span>Category</span>
            <select id="editCategory" required></select>
          </label>

          <label class="field" id="editSubcategoryField" hidden>
            <span>Subcategory <span class="field-optional">(optional)</span></span>
            <select id="editSubcategory">
              <option value="">— None —</option>
            </select>
          </label>

          <label class="field">
            <span>Replace CV <span class="field-optional">(optional — leave empty to keep current)</span></span>
            <input type="file" id="editFile" accept="application/pdf" />
            <p class="current-file" id="editCurrentFile"></p>
          </label>

          <div class="progress-wrap" id="editProgressWrap" hidden>
            <div class="progress-bar"><div class="progress-fill" id="editProgressFill"></div></div>
            <span id="editProgressText">0%</span>
          </div>

          <p id="editStatus" class="status-msg" hidden></p>

          <div class="edit-actions">
            <button type="button" class="btn btn-secondary" data-close-edit>Cancel</button>
            <button type="submit" class="btn btn-primary" id="editSaveBtn">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Khaim Jobs</p>
    </div>
  </footer>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
